<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootyLive Premium + Fixed Ads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-main: #050505;
            --surface: #121212;
            --accent: #00ff88;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: #ffffff;
            margin: 0;
            padding-top: 60px; /* Space for fixed top ad */
        }

        /* --- Fixed Ad Zones --- */
        #ad-top-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            z-index: 1000;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ad-left-fixed {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 60px;
            width: 160px;
            background: #000;
            z-index: 900;
            border-right: 1px solid #333;
            display: none; /* Hidden on mobile */
            justify-content: center;
            padding-top: 20px;
        }

        @media (min-width: 1200px) {
            #ad-left-fixed { display: flex; }
            main { margin-left: 160px; }
        }

        /* --- UI Components --- */
        .match-card {
            background: var(--surface);
            border: 1px solid #222;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .match-card.favorite {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.05);
        }

        .match-card:hover { border-color: var(--accent); }

        .premium-score {
            font-weight: 800;
            font-size: 1.5rem;
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 8px;
            color: var(--accent);
        }

        #ad-bottom-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            z-index: 1000;
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fav-star { color: #ffd700; }
        
        /* Modal Glassmorphism */
        #modal-favorite, #modal-stats {
            backdrop-filter: blur(15px);
            background: rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="pb-20">

    <!-- Fixed Top Ad Strip -->
    <div id="ad-top-fixed">
        <script type="text/javascript">
            atOptions = { 'key' : '5778916', 'format' : 'iframe', 'height' : 60, 'width' : 468, 'params' : {} };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/5778916/invoke.js"></script>
    </div>

    <!-- Fixed Left Ad Skyscraper (Desktop only) -->
    <div id="ad-left-fixed">
        <script type="text/javascript">
            atOptions = { 'key' : '5778916', 'format' : 'iframe', 'height' : 600, 'width' : 160, 'params' : {} };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/5778916/invoke.js"></script>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-4 z-[800] mx-auto max-w-4xl px-4 mt-4">
        <div class="bg-black/80 backdrop-blur-md border border-white/10 rounded-2xl px-6 py-3 flex justify-between items-center shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center">
                    <i class="fas fa-futbol text-black"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tighter">FOOTY<span class="text-emerald-500">LIVE</span></span>
            </div>
            <div class="flex items-center gap-4 text-xs font-bold uppercase">
                <span id="fav-display" class="text-emerald-500 hidden sm:inline-block"></span>
                <button id="btn-actualiser" class="text-white hover:text-emerald-400">
                    <i class="fas fa-redo-alt" id="icone-actualiser"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 mt-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4">
            <div>
                <h2 id="titre-page" class="text-3xl font-extrabold">Matchs du jour</h2>
                <p class="text-slate-500 text-sm">Sélectionnez votre équipe favorite</p>
            </div>
            <div class="flex bg-zinc-900 p-1 rounded-xl border border-white/5">
                <button id="filtre-tous" class="px-6 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black">TOUS</button>
                <button id="filtre-direct" class="px-6 py-2 rounded-lg text-xs font-bold text-slate-400">DIRECT</button>
            </div>
        </div>

        <div id="conteneur-matchs" class="space-y-4">
            <!-- Matches populated by JS -->
        </div>
    </main>

    <!-- Fixed Bottom Ad Strip -->
    <div id="ad-bottom-fixed">
        <script type="text/javascript" src="//www.highperformanceformat.com/5778916/invoke.js"></script>
    </div>

    <!-- Favorite Selection Modal -->
    <div id="modal-favorite" class="fixed inset-0 z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-white/10 w-full max-w-md rounded-3xl p-8 shadow-2xl text-center">
            <h2 class="text-2xl font-black mb-4">Équipe Favorite</h2>
            <input type="text" id="fav-input" placeholder="Real Madrid, Al Hilal..." 
                class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 mb-4">
            <button id="save-fav-btn" class="w-full bg-emerald-500 text-black font-bold py-3 rounded-xl">SAUVEGARDER</button>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="modal-stats" class="fixed inset-0 z-[1500] hidden flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-white/10 w-full max-w-lg rounded-3xl overflow-hidden">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="font-bold text-emerald-400">Statistiques</h3>
                <button onclick="fermerStats()" class="text-slate-500 text-2xl">&times;</button>
            </div>
            <div id="stats-content" class="p-6 space-y-4"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            CLE: 'bebbbc3ed33a067e20d7d61466556062',
            BASE_URL: 'https://v3.football.api-sports.io',
            LIGUES: [2, 3, 15, 39, 140, 78, 135, 61]
        };

        let donneesMatchs = [];
        let equipeFavorite = localStorage.getItem('favTeam') || "";

        function verifierFavori() {
            if (!equipeFavorite) document.getElementById('modal-favorite').classList.remove('hidden');
            else document.getElementById('fav-display').innerText = "FAV: " + equipeFavorite.toUpperCase();
        }

        document.getElementById('save-fav-btn').addEventListener('click', () => {
            const val = document.getElementById('fav-input').value.trim();
            if (val) {
                equipeFavorite = val;
                localStorage.setItem('favTeam', val);
                document.getElementById('modal-favorite').classList.add('hidden');
                location.reload();
            }
        });

        async function chargerMatchs() {
            const icone = document.getElementById('icone-actualiser');
            icone.classList.add('fa-spin');
            try {
                const dateIso = new Date().toISOString().split('T')[0];
                const res = await fetch(`${CONFIG.BASE_URL}/fixtures?date=${dateIso}`, {
                    headers: { 'x-rapidapi-key': CONFIG.CLE, 'x-rapidapi-host': 'v3.football.api-sports.io' }
                });
                const data = await res.json();
                donneesMatchs = data.response;
                
                // Sort by Favorite
                donneesMatchs.sort((a,b) => {
                    const isAFav = a.teams.home.name.toLowerCase().includes(equipeFavorite.toLowerCase()) || a.teams.away.name.toLowerCase().includes(equipeFavorite.toLowerCase());
                    const isBFav = b.teams.home.name.toLowerCase().includes(equipeFavorite.toLowerCase()) || b.teams.away.name.toLowerCase().includes(equipeFavorite.toLowerCase());
                    return isBFav - isAFav;
                });

                genererInterface();
            } catch (e) { console.error(e); }
            icone.classList.remove('fa-spin');
        }

        function genererInterface() {
            const conteneur = document.getElementById('conteneur-matchs');
            conteneur.innerHTML = '';
            
            donneesMatchs.forEach(m => {
                const isFav = equipeFavorite && (m.teams.home.name.toLowerCase().includes(equipeFavorite.toLowerCase()) || m.teams.away.name.toLowerCase().includes(equipeFavorite.toLowerCase()));
                const card = document.createElement('div');
                card.className = `match-card p-4 flex items-center justify-between gap-4 ${isFav ? 'favorite' : ''}`;
                card.innerHTML = `
                    <div class="flex-1 flex items-center gap-2">
                        <img src="${m.teams.home.logo}" class="w-6 h-6">
                        <span class="font-bold text-xs">${m.teams.home.name}</span>
                    </div>
                    <div class="premium-score" dir="ltr">${m.goals.home ?? 0}:${m.goals.away ?? 0}</div>
                    <div class="flex-1 flex items-center gap-2 justify-end">
                        <span class="font-bold text-xs text-right">${m.teams.away.name}</span>
                        <img src="${m.teams.away.logo}" class="w-6 h-6">
                    </div>
                `;
                conteneur.appendChild(card);
            });
        }

        function fermerStats() { document.getElementById('modal-stats').classList.add('hidden'); }

        window.onload = () => {
            verifierFavori();
            chargerMatchs();
            setInterval(chargerMatchs, 60000);
        };
    </script>
</body>
</html>
